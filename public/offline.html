<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Нет подключения — Илона Хоменко</title>
		<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100dvh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, -apple-system, sans-serif;
			background-color: #ffffff;
			color: #1a1a1a;
			padding: 24px;
		}

		.card {
			text-align: center;
			max-width: 400px;
		}

		.icon {
			font-size: 48px;
			margin-bottom: 20px;
		}

		h1 {
			font-size: 22px;
			font-weight: 600;
			color: #3a2c44;
			margin-bottom: 12px;
		}

		p {
			font-size: 16px;
			line-height: 1.6;
			color: #555;
			margin-bottom: 28px;
		}

		button {
			display: inline-block;
			padding: 12px 28px;
			background-color: #3a2c44;
			color: #ffffff;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-family: inherit;
			cursor: pointer;
			text-decoration: none;
		}

		button:hover {
			opacity: 0.85;
		}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="icon">📡</div>
			<h1>Нет подключения к интернету</h1>
			<p>Проверьте соединение и попробуйте снова.</p>
			<button onclick="location.reload()">Попробовать снова</button>
		</div>
	</body>
</html>
